  Persa:[{id:"20lb",label:"20 lb",factor:1},{id:"12x1",label:"12x1",factor:1},{id:"8x2",label:"8x2",factor:1}],
  Slicer:[{id:"36",label:"Caja 36",factor:1},{id:"25lb",label:"25 lb",factor:1},{id:"19",label:"1/9 bushel",factor:2},{id:"24",label:"Caja 24",factor:0.67}],
  Europeo:[{id:"12",label:"Caja 12",factor:1},{id:"24",label:"Caja 24",factor:2},{id:"19",label:"1/9 bushel",factor:4}],
  Morron:[{id:"11lb",label:"11 lb",factor:1},{id:"19",label:"1/9 bushel",factor:2}],
  Minibel:[{id:"12x8oz",label:"12x8oz",factor:6},{id:"12x1",label:"12x1",factor:12},{id:"18lb",label:"18 lb",factor:18}]
};
function initPres(area){var o={};(PRESENTACIONES[area]||[]).forEach(function(p){o[p.id]="";});return o;}
function calcBultosBase(area,pres){
  var total=0;
  (PRESENTACIONES[area]||[]).forEach(function(p){total+=nv(pres[p.id]||0)*p.factor;});
  return Math.round(total*100)/100;
}

function nv(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function ni(v){var x=parseInt(v);return isNaN(x)?0:x;}
function r2(n){return Math.round(n*100)/100;}
function f1(n){return n.toFixed(1);}
function fmt(n){return "$"+n.toFixed(2);}
function hoy(){var d=new Date();d.setDate(d.getDate()-1);return d.toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"});}

/* ---- FECHAS (revision 2026-10-10) -------------------------------------
   Los registros guardan la fecha como TEXTO "dd/mm/aaaa". Un .sort() las
   acomoda por DIA primero, no por anio: por eso el historial salia salteado
   y los "ultimos 14 dias" agarraban julio en lugar de septiembre y octubre
   ("31/07" ordena despues de "09/10" porque 3 es mayor que 0).
   fKey() pasa cualquier formato a un numero aaaammdd que si ordena bien. */
var MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fKey(f){
  var s=String(f||"").trim(),m;
  m=/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.exec(s);
  if(m){var a=+m[3];if(a<100)a+=2000;return a*10000+(+m[2])*100+(+m[1]);}
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m)return (+m[1])*10000+(+m[2])*100+(+m[3]);
  return 0;
}
function cmpF(a,b){var x=fKey(a),y=fKey(b);
  if(x!==y)return x-y;return String(a).localeCompare(String(b));}
function ordF(arr){return arr.slice().sort(cmpF);}
function fISO(f){var k=fKey(f);if(!k)return "";
  return Math.floor(k/10000)+"-"+("0"+(Math.floor(k/100)%100)).slice(-2)+"-"+("0"+(k%100)).slice(-2);}
function deISO(s){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||""));
  if(!m)return "";return ("0"+m[3]).slice(-2)+"/"+("0"+m[2]).slice(-2)+"/"+m[1];}
function fLbl(f){var k=fKey(f);if(!k)return String(f||"");
  return (k%100)+" "+MES3[(Math.floor(k/100)%100)-1];}
function fLargo(f){var k=fKey(f);if(!k)return String(f||"");
  return (k%100)+" de "+MES3[(Math.floor(k/100)%100)-1]+" "+Math.floor(k/10000);}

function initForm(){return{fecha:hoy(),area:"Persa",trabajadores:"",horasExtra:"",cenas:"",pres:initPres("Persa"),horasTrabajadas:"",rejas:"",observaciones:""};}

function calcular(form){
  var trab=ni(form.trabajadores);
  var hExtra=nv(form.horasExtra);
  var ncenas=ni(form.cenas);
  var bultos=calcBultosBase(form.area,form.pres||{});
  var horas=nv(form.horasTrabajadas);
  var rejas=nv(form.rejas);
  var totalSueldos=r2(trab*SUELDO_DIA);
  var totalExtras=r2(hExtra*PRECIO_HORA_EXTRA);
  var totalCenas=r2(ncenas*PRECIO_CENA);
  var totalCosto=r2(totalSueldos+totalExtras+totalCenas);
  var cpb=bultos>0?r2(totalCosto/bultos):0;
  var bxp=trab>0?r2(bultos/trab):0;
  var bxh=horas>0?r2(bultos/horas):0;
  var rxh=horas>0?r2(rejas/horas):0;
  return{trab,hExtra,ncenas,bultos,horas,rejas,totalSueldos,totalExtras,totalCenas,totalCosto,cpb,bxp,bxh,rxh};
}

function kFmt(v){
  if(v>=1000000)return "$"+(v/1000000).toFixed(1)+"M";
  if(v>=1000)return "$"+Math.round(v/1000)+"k";
  return "$"+Math.round(v);
}
/* 12/10/2026: la grafica se encimaba cuando hay muchos dias. Ahora las
   etiquetas se van salteando y los numeros solo salen si caben. */
function LineChart(props){
  var series=props.series||[];var height=props.height||170;
  var n=0;series.forEach(function(s){if(s.datos.length>n)n=s.datos.length;});
  var allVals=[];series.forEach(function(s){s.datos.forEach(function(d){if(d.v>0)allVals.push(d.v);});});
  if(allVals.length<2)return <div style={{fontSize:12,color:"#374151",textAlign:"center",padding:18}}>Sin suficientes datos</div>;
  var maxV=Math.max.apply(null,allVals);var minV=Math.min.apply(null,allVals);
  if(minV>0)minV=0;                      /* el eje arranca en cero: se lee mejor */
  if(maxV===minV)maxV=minV+1;
  var pad={t:16,b:26,l:46,r:12};var W=760;var H=height;
  var iW=W-pad.l-pad.r;var iH=H-pad.t-pad.b;
  var X=function(i){return n<2?pad.l+iW/2:pad.l+iW*(i/(n-1));};
  var Y=function(v){return pad.t+iH*(1-(v-minV)/(maxV-minV));};
  var paso=Math.ceil(n/8);               /* cuantas etiquetas caben */
  var conPunto=n<=24, conNum=n<=12;
  var lineas=[minV,minV+(maxV-minV)/2,maxV];
  return(
    <svg width="100%" viewBox={"0 0 "+W+" "+H} preserveAspectRatio="none" style={{display:"block"}}>
      {lineas.map(function(gv,i){var y=Y(gv);return(
        <g key={i}>
          <line x1={pad.l} y1={y} x2={pad.l+iW} y2={y} stroke="rgba(255,255,255,0.07)" strokeWidth="1"/>
          <text x={pad.l-6} y={y+4} textAnchor="end" fontSize="11" fill="#4a6a7a">{kFmt(gv)}</text>
        </g>);})}
      {series.map(function(s,si){
        var pts=[];
        s.datos.forEach(function(d,i){if(d.v>0)pts.push({x:X(i),y:Y(d.v),v:d.v});});
        if(!pts.length)return null;
        var path="M"+pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" L");
        return(
          <g key={si}>
            <path d={path} fill="none" stroke={s.color} strokeWidth="2.5"
              strokeLinejoin="round" strokeLinecap="round"/>
            {conPunto&&pts.map(function(p,i){return <circle key={i} cx={p.x} cy={p.y} r="3.5"
              fill="#080f14" stroke={s.color} strokeWidth="2"/>;})}
            {conNum&&series.length===1&&pts.map(function(p,i){return <text key={i} x={p.x} y={p.y-9}
              textAnchor="middle" fontSize="11" fill={s.color} fontWeight="700">{kFmt(p.v)}</text>;})}
          </g>
        );
      })}
      {(series[0]||{datos:[]}).datos.map(function(d,i){
        if(i%paso!==0&&i!==n-1)return null;
        return <text key={i} x={X(i)} y={H-7} textAnchor={i===0?"start":(i===n-1?"end":"middle")}
          fontSize="11" fill="#4a6a7a">{d.label}</text>;
      })}
    </svg>
  );
}

function ModalPin(props){
  var s1=useState(""); var v=s1[0]; var sv=s1[1];
  var s2=useState(false); var err=s2[0]; var sErr=s2[1];
  function ok(){if(v===PIN){sv("");sErr(false);props.onOk();}else{sErr(true);sv("");}}
  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.9)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#080f14",border:"2px solid rgba(56,189,248,0.3)",borderRadius:14,padding:28,maxWidth:280,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:16,fontWeight:900,color:"#f0f0e8",marginBottom:4}}>Acceso editor</div>
        <input type="number" value={v} onChange={function(e){sv(e.target.value.slice(0,8));sErr(false);}} placeholder="PIN"
          style={{width:"100%",background:"rgba(0,0,0,0.4)",border:"2px solid "+(err?"#f87171":"rgba(56,189,248,0.4)"),borderRadius:9,padding:"11px",color:"#38bdf8",fontFamily:"Georgia,serif",fontSize:24,textAlign:"center",outline:"none",marginBottom:err?6:14,letterSpacing:6}}/>
        {err&&<div style={{fontSize:12,color:"#f87171",marginBottom:10}}>PIN incorrecto</div>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={props.onCancel} style={{flex:1,padding:"10px",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:8,color:"#6b7280",cursor:"pointer",fontFamily:"system-ui",fontWeight:700}}>Cancelar</button>
          <button onClick={ok} style={{flex:1,padding:"10px",background:"#0e3a5f",border:"2px solid rgba(56,189,248,0.5)",borderRadius:8,color:"#38bdf8",cursor:"pointer",fontFamily:"system-ui",fontWeight:900}}>Entrar</button>
        </div>
      </div>
    </div>
  );
}

var FIXED={fontSize:11,color:"#4a6a7a",marginBottom:3};
var INP={width:"100%",background:"rgba(0,0,0,0.4)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:7,padding:"10px",color:"#f0f0e8",fontFamily:"system-ui",fontSize:16,fontWeight:700,outline:"none"};
var LBL={fontSize:10,color:"#4a6a7a",fontWeight:800,textTransform:"uppercase",letterSpacing:1.2,marginBottom:4,display:"block"};

function App(){
  var s1=useState("cap"); var tab=s1[0]; var setTab=s1[1];
  var s2=useState([]); var registros=s2[0]; var setRegistros=s2[1];
  var s3=useState(initForm()); var form=s3[0]; var setForm=s3[1];
  var s4=useState(false); var auth=s4[0]; var setAuth=s4[1];
  var s5=useState(false); var showPin=s5[0]; var setShowPin=s5[1];
  var s6=useState(null); var pinCb=s6[0]; var setPinCb=s6[1];
  var s7=useState(false); var mob=s7[0]; var setMob=s7[1];
  var s8=useState(null); var openH=s8[0]; var setOpenH=s8[1];
  var s9=useState(""); var fArea=s9[0]; var setFArea=s9[1];
  var s10=useState(""); var fConc=s10[0]; var setFConc=s10[1];
  var s11=useState(false); var cargando=s11[0]; var setCargando=s11[1];
  var s12=useState(null); var editR=s12[0]; var setEditR=s12[1];
  var s13=useState(null); var confirmBorrarDia=s13[0]; var setConfirmBorrarDia=s13[1];
  var s14=useState(null); var prevExtras=s14[0]; var setPrevExtras=s14[1]; // para deshacer jalar
  var s15=useState([]); var mesesBkp=s15[0]; var setMesesBkp=s15[1];   // meses de respaldo que SI existen
  var s16=useState(""); var busca=s16[0]; var setBusca=s16[1];         // buscador de un dia en el historial
  var s17=useState(null); var bkps=s17[0]; var setBkps=s17[1];         // respaldos leidos de Firebase
  var s18=useState(""); var bkMsg=s18[0]; var setBkMsg=s18[1];
  var s19=useState(false); var cargaOk=s19[0]; var setCargaOk=s19[1];  // la carga inicial si llego
  var s20=useState(""); var hConc=s20[0]; var setHConc=s20[1];         // concepto en el historial
  var s21=useState("gasto"); var dMetr=s21[0]; var setDMetr=s21[1];    // que grafica el dashboard
  var s22=useState(""); var dDe=s22[0]; var setDDe=s22[1];              // periodo del dashboard
  var s23=useState(""); var dHa=s23[0]; var setDHa=s23[1];

  useEffect(function(){
    function resize(){setMob(window.innerWidth<768);}
    resize();window.addEventListener("resize",resize);
    return function(){window.removeEventListener("resize",resize);};
  },[]);

  useEffect(function(){
    setCargando(true);
    fetch(FB).then(function(r){return r.json();}).then(function(d){
      /* Firebase devuelve OBJETO en vez de arreglo cuando quedan huecos de
         indice (pasa al borrar registros de en medio). Antes el
         Array.isArray fallaba y la app se quedaba sin ningun dato. */
      var arr=[];
      if(Array.isArray(d))arr=d.filter(function(x){return !!x;});
      else if(d&&typeof d==="object")arr=Object.keys(d).map(function(k){return d[k];}).filter(function(x){return !!x;});
      if(arr.length)setRegistros(arr);
      setCargaOk(true);
      setCargando(false);
    }).catch(function(){setCargando(false);});
  },[]);

  useEffect(function(){
    /* La lista de meses del respaldo estaba escrita a mano y se quedo en
       julio 2026. Ahora se leen las llaves que de veras hay en Firebase. */
    fetch(FB_BACKUP.replace(".json",".json?shallow=true"))
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d)return;
        var ms=Object.keys(d).map(function(k){return k.replace("mes_","").replace("_","-");})
          .filter(function(x){return /^\d{4}-\d{2}$/.test(x);});
        ms.sort().reverse();
        if(ms.length)setMesesBkp(ms);
      }).catch(function(){});
  },[]);

  function save(v){
    /* CANDADO (12/10/2026): si la lectura inicial no llego, la pantalla puede
       estar vacia o incompleta. Un PUT en ese momento se lleva TODO lo que
       habia en Firebase. Por eso aqui no se escribe nada hasta que la carga
       haya respondido. */
    if(!cargaOk){
      alert("Todavia no carga el historial. No se guardo nada; vuelve a intentar en un momento.");
      return;
    }
    // Proteccion: nunca guardar array vacio si ya habia datos
    if((!v||v.length===0)&&registros.length>0){
      console.warn("Intento de borrar todos los registros bloqueado");
      return;
    }
    setRegistros(v);
    fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
    // Respaldo automatico mensual en nodo separado
    try{
      /* Este respaldo es una COPIA COMPLETA de todos los registros, con el
         nombre del mes en que se guardo. No es "los datos de ese mes". */
      var mesActual=new Date().toISOString().slice(0,7);
      var keyMes="mes_"+mesActual.replace("-","_");
      var bkUrl=FB_BACKUP.replace(".json","/"+keyMes+".json");
      fetch(bkUrl,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
    }catch(e){}
  }
  function exportarJSON(){
    var blob=new Blob([JSON.stringify(registros,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="gastos-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  /* ---------- RECUPERAR LO QUE FALTA (12/10/2026) ----------
     Lee TODOS los respaldos y regresa SOLO los dias-linea que ya no estan en
     la base de ahora. No borra ni pisa nada de lo que si esta. */
  function aLista(d){
    if(Array.isArray(d))return d.filter(function(x){return !!x;});
    if(d&&typeof d==="object")return Object.keys(d).map(function(k){return d[k];}).filter(function(x){return !!x;});
    return [];
  }
  function claveDL(r){return fKey(r.fecha)+"|"+r.area;}
  function esReg(r){return !!(r&&typeof r==="object"&&r.fecha&&r.area&&fKey(r.fecha)>0);}
  var MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  function mesesDe(lista){
    var m={};lista.forEach(function(r){var k=fKey(r.fecha);if(k>0)m[Math.floor(k/100)]=1;});
    return Object.keys(m).map(Number).sort(function(a,b){return a-b;})
      .map(function(x){return MES3[(x%100)-1]+" "+Math.floor(x/100);}).join(" . ");
  }
  function dosD(n){return (n<10?"0":"")+n;}
  function txtK(k){return dosD(k%100)+"/"+dosD(Math.floor(k/100)%100)+"/"+Math.floor(k/10000);}
  function rangoDe(lista){
    var ks=lista.map(function(r){return fKey(r.fecha);}).filter(function(x){return x>0;})
      .sort(function(a,b){return a-b;});
    if(!ks.length)return "--";
    return txtK(ks[0])+" al "+txtK(ks[ks.length-1]);
  }
  function faltantesDe(lista){
    var mios={};registros.forEach(function(r){mios[claveDL(r)]=1;});
    return lista.filter(function(r){return r&&r.fecha&&r.area&&!mios[claveDL(r)];});
  }
  /* Barre TODAS las llaves de Firebase que tengan que ver con gastos y arma la
     lista de fuentes con registros. Asi no hay que adivinar donde quedo nada. */
  function escanea(){
    setBkMsg("Buscando en todo Firebase...");
    fetch(FB_RAIZ+".json?shallow=true").then(function(r){return r.json();}).then(function(d){
      var llaves=Object.keys(d||{}).filter(function(k){return /gasto/i.test(k);});
      if(!llaves.length){setBkps([]);setBkMsg("No hay ningun nodo de gastos en Firebase.");return;}
      Promise.all(llaves.map(function(k){
        return fetch(FB_RAIZ+k+".json").then(function(r){return r.json();})
          .then(function(v){return {k:k,v:v};})
          .catch(function(){return {k:k,v:null};});
      })).then(function(res){
        var out=[];
        res.forEach(function(x){
          var directo=aLista(x.v).filter(esReg);
          if(directo.length){
            out.push({k:x.k,mes:x.k,n:directo.length,rango:rangoDe(directo),
                      meses:mesesDe(directo),lista:directo});
            return;
          }
          if(x.v&&typeof x.v==="object")Object.keys(x.v).forEach(function(sub){
            var l2=aLista(x.v[sub]).filter(esReg);
            if(!l2.length)return;
            out.push({k:x.k+"/"+sub,mes:x.k+" / "+sub.replace("mes_","").replace("_","-"),
                      n:l2.length,rango:rangoDe(l2),meses:mesesDe(l2),lista:l2});
          });
        });
        out.sort(function(a,b){return b.n-a.n;});
        setBkps(out);
        setBkMsg(out.length?"":"No se encontro ningun registro guardado.");
      });
    }).catch(function(){setBkMsg("No se pudo leer Firebase.");});
  }
  function revisaRespaldos(conserva){
    if(!conserva)setBkMsg("Revisando...");
    fetch(FB_BACKUP).then(function(r){return r.json();}).then(function(d){
      if(!d){setBkps([]);setBkMsg("No hay respaldos en Firebase.");return;}
      var out=Object.keys(d).map(function(k){
        var lista=aLista(d[k]);
        /* el conteo de faltantes NO se guarda aqui: se calcula al pintar,
           con los registros de ese momento, si no se queda viejo */
        return {k:k,mes:k.replace("mes_","").replace("_","-"),n:lista.length,
                rango:rangoDe(lista),meses:mesesDe(lista),lista:lista};
      }).sort(function(a,b){return a.mes<b.mes?1:-1;});
      setBkps(out);if(!conserva)setBkMsg("");
    }).catch(function(){setBkMsg("No se pudo leer el respaldo.");});
  }
  function traeFaltantes(lista){
    var nuevos=faltantesDe(lista);
    if(!nuevos.length){setBkMsg("Ese respaldo no trae nada que falte.");return;}
    var union=registros.concat(nuevos);
    union.sort(function(a,b){return fKey(a.fecha)-fKey(b.fecha);});
    setRegistros(union);
    fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(union)})
      .then(function(){setBkMsg("Se regresaron "+nuevos.length+" registros. Ahora hay "+union.length+".");
        setTimeout(function(){revisaRespaldos(true);},400);})
      .catch(function(){setBkMsg("No se pudo escribir en Firebase.");});
  }
  function traeTodo(){
    if(!bkps||!bkps.length)return;
    var todo=[];bkps.forEach(function(b){todo=todo.concat(b.lista);});
    var vistos={},unicos=[];
    todo.forEach(function(r){if(!r||!r.fecha||!r.area)return;
      var k=claveDL(r)+"|"+(r.id||"");if(vistos[k])return;vistos[k]=1;unicos.push(r);});
    traeFaltantes(unicos);
  }
  function restaurarMes(mes){
    /* 12/10/2026: ANTES ESTE BOTON REEMPLAZABA TODO con el respaldo del mes, y
       con eso se podia perder lo que si estaba. Ahora AGREGA lo que falte y no
       borra nada, igual que el bloque verde. */
    var keyMes="mes_"+mes.replace("-","_");
    var bkUrl=FB_BACKUP.replace(".json","/"+keyMes+".json");
    fetch(bkUrl).then(function(r){return r.json();}).then(function(dr){
      var d=aLista(dr).filter(esReg);
      if(d.length>0)traeFaltantes(d);
      else alert("Sin respaldo disponible para "+mes);
    }).catch(function(){alert("Error al recuperar respaldo");});
  }

                      {CONCEPTOS.map(function(c){var sel=fConc===c;var col=c==="Extras"?"#fbbf24":c==="Cenas"?"#fb923c":"#e8e4d8";return(
                        <button key={c} onClick={function(){setFConc(sel?"":c);}}

                      <span style={{color:"#4a6a7a",fontSize:12}}>a</span>
                      <input type="date" value={dHa} onChange={function(e){setDHa(e.target.value);}}
                        style={{background:"rgba(0,0,0,0.4)",border:"2px solid rgba(56,189,248,0.3)",borderRadius:8,padding:"8px 10px",color:"#38bdf8",fontFamily:"system-ui",fontSize:14,fontWeight:700,outline:"none"}}/>
                      {(dDe||dHa)&&<button onClick={function(){setDDe("");setDHa("");}}
                        style={{padding:"8px 16px",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.12)",borderRadius:8,color:"#9ca3af",fontFamily:"system-ui",fontSize:13,fontWeight:800,cursor:"pointer"}}>Todo</button>}
                      <div style={{flex:1}}/>
                      <div style={{display:"flex",gap:6}}>
                        {[["gasto","gasto"],["cpb","costo/bulto"]].map(function(m){var sel=dMetr===m[0];return(
                          <button key={m[0]} onClick={function(){setDMetr(m[0]);}}
                            style={{padding:"7px 14px",border:"2px solid "+(sel?"#38bdf8":"rgba(255,255,255,0.1)"),borderRadius:18,background:sel?"rgba(56,189,248,0.15)":"transparent",color:sel?"#38bdf8":"#4a6a7a",fontFamily:"system-ui",fontSize:12,fontWeight:800,cursor:"pointer"}}>{m[1]}</button>
                        );})}
                      </div>
                    </div>
                  </div>

                  {/* UNA SOLA GRAFICA, la de lo que se filtro */}
                  {(function(){
                    var areas=fArea?[fArea]:AREA_NAMES;
                    var fs=[],vistas={};
                    regD.forEach(function(r){var k=fKey(r.fecha);
                      if(!vistas[k]&&areas.indexOf(r.area)>=0){vistas[k]=r.fecha;}});
                    fs=Object.keys(vistas).map(Number).sort(function(a,b){return a-b;})
                      .map(function(k){return vistas[k];});
                    if(fs.length<2)return null;
                    function val(rr){
                      var totB=rr.reduce(function(s,r){return s+(r.bultos||0);},0);
                      var totC=0;
                      if(fConc==="Sueldos")totC=rr.reduce(function(s,r){return s+(r.totalSueldos||0);},0);
                      else if(fConc==="Extras")totC=rr.reduce(function(s,r){return s+(r.totalExtras||0);},0);
                      else if(fConc==="Cenas")totC=rr.reduce(function(s,r){return s+(r.totalCenas||0);},0);
                      else totC=rr.reduce(function(s,r){return s+(r.totalCosto||0);},0);
                      return dMetr==="gasto"?r2(totC):(totB>0?r2(totC/totB):0);
                    }
                    var series=areas.map(function(a){
                      return {label:a,color:AREAS[a].color,
                        datos:fs.map(function(f){
                          return {label:fLbl(f),
                            v:val(regD.filter(function(r){return r.area===a&&r.fecha===f;}))};})};
                    }).filter(function(s){return s.datos.some(function(d){return d.v>0;});});
                    if(!series.length)return null;
                    return(
                      <div style={{background:"rgba(255,255,255,0.04)",border:"2px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"16px 18px",marginBottom:16}}>

                          <div style={{fontSize:12,fontWeight:900,color:"#38bdf8",letterSpacing:1}}>

                      </div>

                  {/* Acumulado por area + concepto */}
                  {(fArea||fConc)&&(function(){
                    var areas=fArea?[fArea]:AREA_NAMES;
                    var totalAcum=0;
                    var desglose=areas.map(function(a){
                      var rA=regD.filter(function(r){return r.area===a;});
                      var val=0;
                      if(fConc==="Sueldos")val=rA.reduce(function(s,r){return s+(r.totalSueldos||0);},0);
                      else if(fConc==="Extras")val=rA.reduce(function(s,r){return s+(r.totalExtras||0);},0);
                      else if(fConc==="Cenas")val=rA.reduce(function(s,r){return s+(r.totalCenas||0);},0);
                      else val=rA.reduce(function(s,r){return s+(r.totalCosto||0);},0);
                      totalAcum+=val;
                      return{area:a,val:val,dias:rA.length};
                    });
                    return(
                      <div style={{background:"rgba(56,189,248,0.08)",border:"2px solid rgba(56,189,248,0.3)",borderRadius:12,padding:"18px",marginBottom:20}}>

                        <div style={{textAlign:"center",marginBottom:16,paddingBottom:14,borderBottom:"1px solid rgba(56,189,248,0.15)"}}>
                          <div style={{fontSize:10,color:"#38bdf8",fontWeight:900,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>
                            {fArea||"TODAS LAS AREAS"} - {fConc||"COSTO TOTAL"}
                          </div>
                          <div style={{fontSize:38,fontWeight:900,color:"#38bdf8",fontFamily:"Georgia,serif"}}>{fmt(totalAcum)}</div>
                          <div style={{fontSize:11,color:"#4a6a7a",marginTop:2}}>acumulado historico</div>
                        </div>
                        {/* Desglose por area */}
                        {desglose.map(function(d){
                          var col=AREAS[d.area]?AREAS[d.area].color:"#38bdf8";
                          var pct=totalAcum>0?Math.round(d.val/totalAcum*100):0;
                          return(
                            <div key={d.area} style={{marginBottom:10,opacity:d.val===0?0.4:1}}>
                              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>

                                <div style={{textAlign:"right"}}>
                                  <span style={{fontSize:15,fontWeight:900,color:d.val>0?"#f0f0e8":"#4a6a7a",fontFamily:"Georgia,serif"}}>{fmt(d.val)}</span>
                                  <span style={{fontSize:10,color:"#4a6a7a",marginLeft:6}}>{d.dias} dias</span>
                                </div>
                              </div>
                              <div style={{height:6,background:"rgba(255,255,255,0.07)",borderRadius:3,overflow:"hidden"}}>
                                <div style={{height:"100%",width:pct+"%",background:col,borderRadius:3,transition:"width 0.3s"}}/>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}

                  {/* Graficas por area */}
                  {(fArea?[fArea]:AREA_NAMES).map(function(a){
                    var rA=regD.filter(function(r){return r.area===a;});
                    if(!rA.length)return null;
                    var fechasA=[];var fSetA={};
                    rA.forEach(function(r){if(!fSetA[r.fecha]){fSetA[r.fecha]=true;fechasA.push(r.fecha);}});
                    fechasA=ordF(fechasA).reverse();
                    return(
                      <div key={a} style={{background:"rgba(255,255,255,0.04)",border:"2px solid "+AREAS[a].color+"33",borderRadius:12,marginBottom:14,overflow:"hidden"}}>

                          <div style={{fontSize:12,color:"#4a6a7a"}}>{fechasA.length} dias registrados</div>
                        </div>
                        <div style={{padding:"12px 20px"}}>
                          <div style={{fontSize:12,fontWeight:900,color:"#38bdf8",marginBottom:12}}>Costo/bulto por fecha</div>

                            var rF=rA.filter(function(r){return r.fecha===f;});
                            var totB=rF.reduce(function(s,r){return s+r.bultos;},0);
                            var totC=rF.reduce(function(s,r){return s+r.totalCosto;},0);
                            var totT=rF.reduce(function(s,r){return s+r.trabajadores;},0);
                            var cpb=totB>0?r2(totC/totB):0;
                            var bxp=totT>0?r2(totB/totT):0;
                            var isOpen=openH===a+f;
                            return(
                              <div key={f} style={{borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                                <div onClick={function(){setOpenH(isOpen?null:a+f);}}

                                    <div style={{fontSize:14,fontWeight:800,color:"#f0f0e8"}}>{f}</div>
                                    <div style={{fontSize:11,color:"#4a6a7a",marginTop:2}}>{totT} trab . {totB} btos . {fmt(totC)}</div>
                                  </div>
                                  <div style={{textAlign:"right"}}>
                                    <div style={{fontSize:18,fontWeight:900,color:AREAS[a].color,fontFamily:"Georgia,serif"}}>{fmt(cpb)}</div>
                                    <div style={{fontSize:11,color:"#4a6a7a"}}>costo por bulto &middot; {fmt(totC)} el dia</div>
                                  </div>
                                  <div style={{fontSize:14,color:"#4a6a7a",minWidth:16}}>{isOpen?"-":"+"}</div>
                                </div>
                                {isOpen&&(
                                  <div style={{background:"rgba(0,0,0,0.25)",borderRadius:9,padding:"12px",marginBottom:8}}>
                                    {rF.map(function(r,ri){
                                      return(
                                        <div key={ri} style={{borderBottom:ri<rF.length-1?"1px solid rgba(255,255,255,0.05)":"none",paddingBottom:ri<rF.length-1?10:0,marginBottom:ri<rF.length-1?10:0}}>
                                          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:8}}>
                                            <div style={{textAlign:"center"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>TRAB</div>
                                              <div style={{fontSize:18,fontWeight:700,color:"#e8e4d8"}}>{r.trabajadores}</div>
                                            </div>
                                            <div style={{textAlign:"center"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>SUELDOS</div>
                                              <div style={{fontSize:14,fontWeight:700,color:"#e8e4d8"}}>{fmt(r.totalSueldos)}</div>
                                            </div>
                                            <div style={{textAlign:"center"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>EXTRAS</div>
                                              <div style={{fontSize:14,fontWeight:700,color:"#fbbf24"}}>{fmt(r.totalExtras)}</div>
                                            </div>
                                            <div style={{textAlign:"center"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>CENAS</div>
                                              <div style={{fontSize:14,fontWeight:700,color:"#fb923c"}}>{fmt(r.totalCenas)}</div>
                                            </div>
                                          </div>
                                          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:4}}>
                                            <div style={{textAlign:"center",background:"rgba(56,189,248,0.08)",borderRadius:7,padding:"6px"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>COSTO/BULTO</div>
                                              <div style={{fontSize:16,fontWeight:900,color:"#38bdf8"}}>{fmt(r.cpb)}</div>
                                            </div>
                                            <div style={{textAlign:"center",background:"rgba(0,0,0,0.2)",borderRadius:7,padding:"6px"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>BTOS/PERSONA</div>
                                              <div style={{fontSize:16,fontWeight:900,color:AREAS[a].color}}>{f1(r.bxp)}</div>
                                            </div>
                                            <div style={{textAlign:"center",background:"rgba(0,0,0,0.2)",borderRadius:7,padding:"6px"}}>
                                              <div style={{fontSize:9,color:"#4a6a7a"}}>BTOS/HORA</div>
                                              <div style={{fontSize:16,fontWeight:900,color:"#c084fc"}}>{r.bxh>0?f1(r.bxh):"-"}</div>
                                            </div>
                                          </div>
                                          {r.observaciones&&<div style={{fontSize:12,color:"#6b7280",fontStyle:"italic",marginTop:6}}>Obs: {r.observaciones}</div>}
                                          {auth&&(
                                            <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                                              <button onClick={function(){pinReq(function(){setEditR(Object.assign({},r,{trabajadores:String(r.trabajadores),horasExtra:String(r.horasExtra),cenas:String(r.cenas),pres:r.pres||initPres(r.area)}));});}}
                                                style={{padding:"5px 12px",background:"rgba(56,189,248,0.1)",border:"1px solid rgba(56,189,248,0.3)",borderRadius:6,color:"#38bdf8",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>
                                                Editar
                                              </button>
                                              <button onClick={function(){pinReq(function(){setConfirmBorrarDia({area:a,fecha:f});});}}
                                                style={{padding:"5px 12px",background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.3)",borderRadius:6,color:"#fbbf24",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>
                                                Borrar dia completo
                                              </button>
                                              <button onClick={function(){pinReq(function(){save(registros.filter(function(x){return x.id!==r.id;}));});}}
                                                style={{padding:"5px 12px",background:"transparent",border:"1px solid rgba(248,113,113,0.2)",borderRadius:6,color:"#f87171",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>
                                                Borrar este registro
                                              </button>
                                            </div>
                                          )}
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )
            }
          </div>
          );
        })()}

        {/* HISTORIAL */}
        {tab==="hist"&&(
          <div>
            {auth&&(
              <div style={{background:"rgba(248,113,113,0.08)",border:"2px solid rgba(248,113,113,0.25)",borderRadius:10,padding:"12px 18px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
                <div style={{fontSize:14,fontWeight:700,color:"#f87171"}}>Borrar historial completo</div>

                  Borrar todo
                </button>
              </div>
            )}
            {/* BUSCAR UN DIA (revision 2026-10-10) */}
            <div style={{background:"rgba(56,189,248,0.06)",border:"2px solid rgba(56,189,248,0.25)",borderRadius:12,padding:"14px 18px",marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:900,color:"#38bdf8",marginBottom:10}}>Buscar un dia</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                <input type="date" value={busca} onChange={function(e){setBusca(e.target.value);}}
                  style={{background:"rgba(0,0,0,0.4)",border:"2px solid rgba(56,189,248,0.35)",borderRadius:8,padding:"9px 10px",color:"#38bdf8",fontFamily:"system-ui",fontSize:15,fontWeight:700,outline:"none"}}/>
                {busca&&<button onClick={function(){setBusca("");}} style={{padding:"9px 16px",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.12)",borderRadius:8,color:"#9ca3af",fontFamily:"system-ui",fontSize:13,fontWeight:800,cursor:"pointer"}}>Ver todos los dias</button>}
                <div style={{flex:1}}/>
                <div style={{fontSize:11,color:"#4a6a7a"}}>{(function(){var q={};registros.forEach(function(r){q[fKey(r.fecha)]=1;});return Object.keys(q).length;})()} dias guardados</div>
              </div>
              {busca&&(function(){
                var kB=fKey(busca);
                var rD=registros.filter(function(r){return fKey(r.fecha)===kB;});
                if(!rD.length)return <div style={{marginTop:14,fontSize:13,color:"#f87171",fontWeight:700}}>No hay nada capturado el {fLargo(busca)}.</div>;
                var filas=AREA_NAMES.map(function(a){
                  var rA=rD.filter(function(r){return r.area===a;});
                  if(!rA.length)return null;
                  var o={area:a,trab:0,bultos:0,sue:0,ext:0,cen:0,tot:0};
                  rA.forEach(function(r){o.trab+=(r.trabajadores||0);o.bultos+=(r.bultos||0);
                    o.sue+=(r.totalSueldos||0);o.ext+=(r.totalExtras||0);
                    o.cen+=(r.totalCenas||0);o.tot+=(r.totalCosto||0);});
                  o.cpb=o.bultos>0?r2(o.tot/o.bultos):0;
                  return o;
                }).filter(function(x){return !!x;});
                var T={trab:0,bultos:0,sue:0,ext:0,cen:0,tot:0};
                filas.forEach(function(o){T.trab+=o.trab;T.bultos+=o.bultos;T.sue+=o.sue;
                  T.ext+=o.ext;T.cen+=o.cen;T.tot+=o.tot;});
                return(
                  <div style={{marginTop:14}}>
                    <div style={{fontSize:15,fontWeight:900,color:"#f0f0e8",marginBottom:8}}>Costo del {fLargo(busca)}</div>
                    <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:620}}>
                      <thead><tr>
                        <th style={Object.assign({},{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"},{textAlign:"left"})}>Linea</th>
                        <th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Trab</th><th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Bultos</th>
                        <th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Sueldos</th><th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Extras</th>
                        <th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Cenas</th><th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Costo del dia</th>
                        <th style={{padding:"7px 8px",borderBottom:"2px solid rgba(56,189,248,0.25)",fontSize:10,color:"#4a6a7a",fontWeight:900,letterSpacing:1,textTransform:"uppercase",textAlign:"right"}}>Costo/bulto</th>
                      </tr></thead>
                      <tbody>
                        {filas.map(function(o){return(
                          <tr key={o.area}>
                            <td style={Object.assign({},{padding:"7px 8px",borderBottom:"1px solid rgba(255,255,255,0.06)",fontSize:13},{fontWeight:900,color:AREAS[o.area].color})}>{o.area}</td>
                            <td style={Object.assign({},{padding:"7px 8px",borderBottom:"1px solid rgba(255,255,255,0.06)",fontSize:13},{textAlign:"right"})}>{o.trab}</td>

            {/* CUANTO SE GASTO, POR LINEA Y POR CONCEPTO */}
            {registros.length>0&&(function(){
              var lineas=fArea?[fArea]:AREA_NAMES;
              var filas=lineas.map(function(a){
                var rA=registros.filter(function(r){return r.area===a&&(!busca||fKey(r.fecha)===fKey(busca));});
                var o={area:a,sue:0,ext:0,cen:0,dias:{}};
                rA.forEach(function(r){o.sue+=(r.totalSueldos||0);o.ext+=(r.totalExtras||0);
                  o.cen+=(r.totalCenas||0);o.dias[fKey(r.fecha)]=1;});
                o.tot=o.sue+o.ext+o.cen;
                o.sel=hConc==="Sueldos"?o.sue:hConc==="Extras"?o.ext:hConc==="Cenas"?o.cen:o.tot;
                o.nd=Object.keys(o.dias).length;
                return o;
              });
              var T={sue:0,ext:0,cen:0,tot:0,sel:0};
              filas.forEach(function(o){T.sue+=o.sue;T.ext+=o.ext;T.cen+=o.cen;T.tot+=o.tot;T.sel+=o.sel;});

                      <th style={Object.assign({},th,{opacity:apg("Extras")})}>Extras</th>

                          <td style={Object.assign({},td,{color:"#fb923c",opacity:apg("Cenas")})}>{fmt(o.cen)}</td>

                        <td style={Object.assign({},td,{fontWeight:900,color:"#fbbf24",borderTop:"2px solid rgba(56,189,248,0.3)",opacity:apg("Extras")})}>{fmt(T.ext)}</td>
                        <td style={Object.assign({},td,{fontWeight:900,color:"#fb923c",borderTop:"2px solid rgba(56,189,248,0.3)",opacity:apg("Cenas")})}>{fmt(T.cen)}</td>
                        <td style={Object.assign({},td,{fontWeight:900,color:"#38bdf8",fontSize:17,borderTop:"2px solid rgba(56,189,248,0.3)"})}>{fmt(T.sel)}</td>
                      </tr>

                  </table>
                  </div>

                        var totT=rF.reduce(function(s,r){return s+r.trabajadores;},0);

                              <div style={{textAlign:"right",minWidth:104}}>
                                <div style={{fontSize:18,fontWeight:900,color:AREAS[a].color,fontFamily:"Georgia,serif"}}>{fmt(cpb)}</div>

                              </div>
                              <div style={{textAlign:"right",minWidth:104}}>
                                <div style={{fontSize:18,fontWeight:900,color:"#f0f0e8",fontFamily:"Georgia,serif"}}>{fmt(totC)}</div>
                                <div style={{fontSize:10,color:"#4a6a7a"}}>costo del dia</div>

                                        <div style={{textAlign:"center"}}>
                                          <div style={{fontSize:9,color:"#4a6a7a"}}>TRAB</div>

                                        </div>
                                        <div style={{textAlign:"center"}}>
                                          <div style={{fontSize:9,color:"#4a6a7a"}}>SUELDOS</div>
                                          <div style={{fontSize:14,fontWeight:700,color:"#e8e4d8"}}>{fmt(r.totalSueldos)}</div>
                                        </div>
                                        <div style={{textAlign:"center"}}>
                                          <div style={{fontSize:9,color:"#4a6a7a"}}>EXTRAS</div>

                                        <div style={{textAlign:"center"}}>
                                          <div style={{fontSize:9,color:"#4a6a7a"}}>CENAS</div>
                                          <div style={{fontSize:14,fontWeight:700,color:"#fb923c"}}>{fmt(r.totalCenas)}</div>
                                        </div>
                                      </div>
                                      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:4}}>
                                        <div style={{textAlign:"center",background:"rgba(56,189,248,0.08)",borderRadius:7,padding:"6px"}}>
                                          <div style={{fontSize:9,color:"#4a6a7a"}}>COSTO/BULTO</div>
                                          <div style={{fontSize:16,fontWeight:900,color:"#38bdf8"}}>{fmt(r.cpb)}</div>
                                        </div>
                                        <div style={{textAlign:"center",background:"rgba(0,0,0,0.2)",borderRadius:7,padding:"6px"}}>
                                          <div style={{fontSize:9,color:"#4a6a7a"}}>BTOS/PERSONA</div>
                                          <div style={{fontSize:16,fontWeight:900,color:AREAS[a].color}}>{f1(r.bxp)}</div>

                                        <div style={{textAlign:"center",background:"rgba(0,0,0,0.2)",borderRadius:7,padding:"6px"}}>

                                            style={{padding:"5px 12px",background:"rgba(56,189,248,0.1)",border:"1px solid rgba(56,189,248,0.3)",borderRadius:6,color:"#38bdf8",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>
                                            Editar
                                          </button>
                                          <button onClick={function(){pinReq(function(){setConfirmBorrarDia({area:a,fecha:f});});}}
                                            style={{padding:"5px 12px",background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.3)",borderRadius:6,color:"#fbbf24",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>
                                            Borrar dia completo
                                          </button>
                                          <button onClick={function(){pinReq(function(){save(registros.filter(function(x){return x.id!==r.id;}));});}}
                                            style={{padding:"5px 12px",background:"transparent",border:"1px solid rgba(248,113,113,0.2)",borderRadius:6,color:"#f87171",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>
                                            Borrar este registro
                                          </button>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })
            }
          </div>
        )}

        {tab==="bkp"&&(

            <div style={{background:"rgba(56,189,248,0.05)",border:"2px solid rgba(56,189,248,0.2)",borderRadius:12,padding:"16px",marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:900,color:"#38bdf8",marginBottom:8}}>Descargar copia local</div>
              <button onClick={exportarJSON} style={{width:"100%",padding:"12px",background:"rgba(56,189,248,0.15)",border:"2px solid rgba(56,189,248,0.4)",borderRadius:9,color:"#38bdf8",fontFamily:"system-ui",fontSize:14,fontWeight:900,cursor:"pointer"}}>

            <div style={{background:"rgba(245,158,11,0.05)",border:"2px solid rgba(245,158,11,0.2)",borderRadius:12,padding:"16px",marginBottom:12}}>

                  style={{padding:"10px 16px",background:"rgba(245,158,11,0.15)",border:"2px solid rgba(245,158,11,0.4)",borderRadius:8,color:"#f59e0b",fontFamily:"system-ui",fontSize:13,fontWeight:900,cursor:"pointer"}}>Recuperar</button>
              </div>
            </div>
            {/* RECUPERAR LO QUE FALTA (12/10/2026) */}
            <div style={{background:"rgba(74,222,128,0.06)",border:"2px solid rgba(74,222,128,0.3)",borderRadius:12,padding:"16px",marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
                <div style={{fontSize:12,fontWeight:900,color:"#4ade80"}}>Recuperar lo que falta</div>
                <div style={{display:"flex",gap:7}}>

                  <button onClick={function(){revisaRespaldos();}}
                    style={{padding:"8px 14px",background:"rgba(74,222,128,0.1)",border:"2px solid rgba(74,222,128,0.3)",borderRadius:8,color:"#4ade80",fontFamily:"system-ui",fontSize:13,fontWeight:900,cursor:"pointer"}}>Solo respaldos</button>

              </div>

                    <div key={b.k} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:900,color:"#f0f0e8"}}>{b.mes}</div>
                        <div style={{fontSize:11,color:"#4a6a7a"}}>{b.n} registros &middot; {b.rango}</div>
                        <div style={{fontSize:11,color:"#38bdf8",fontWeight:700,marginTop:2}}>{b.meses}</div>
                      </div>
                      <div style={{fontSize:13,fontWeight:900,color:falta>0?"#fbbf24":"#4a6a7a",minWidth:62,textAlign:"right"}}>
                        {falta>0?falta+" faltan":"al dia"}
                      </div>
                      {falta>0&&<button onClick={function(){traeFaltantes(b.lista);}}
                        style={{padding:"7px 13px",background:"rgba(74,222,128,0.15)",border:"2px solid rgba(74,222,128,0.4)",borderRadius:8,color:"#4ade80",fontFamily:"system-ui",fontSize:12,fontWeight:900,cursor:"pointer",whiteSpace:"nowrap"}}>Traer</button>}
                    </div>
                  );})}
                  {bkps.some(function(b){return faltantesDe(b.lista).length>0;})&&(
                    <button onClick={traeTodo} style={{width:"100%",marginTop:12,padding:"12px",background:"rgba(74,222,128,0.18)",border:"2px solid rgba(74,222,128,0.5)",borderRadius:9,color:"#4ade80",fontFamily:"system-ui",fontSize:14,fontWeight:900,cursor:"pointer"}}>
                      Traer todo lo que falte
                    </button>
                  )}
                </div>
              )}
            </div>
            <div style={{background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"12px",fontSize:11,color:"#4a6a7a",lineHeight:1.8}}>
              Registros: <strong style={{color:"#38bdf8"}}>{registros.length}</strong><br/>
              Desde: <strong style={{color:"#38bdf8"}}>{fechas.length>0?fechas[0]:"--"}</strong><br/>
              Hasta: <strong style={{color:"#38bdf8"}}>{fechas.length>0?fechas[fechas.length-1]:"--"}</strong>
            </div>
          </div>
        )}
      {showPin&&<ModalPin onOk={function(){pinOk();}} onCancel={function(){setShowPin(false);setPinCb(null);}}/>}

      {/* Modal confirmar borrar dia */}
      {confirmBorrarDia&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.9)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#080f14",border:"2px solid rgba(251,191,36,0.4)",borderRadius:14,padding:28,maxWidth:320,width:"100%",textAlign:"center"}}>
            <div style={{fontSize:17,fontWeight:900,color:"#fbbf24",marginBottom:8}}>Borrar dia completo</div>
            <div style={{fontSize:14,color:"#9ca3af",marginBottom:20}}>Se borraran todos los registros de <b style={{color:"#f0f0e8"}}>{confirmBorrarDia.area}</b> del dia <b style={{color:"#f0f0e8"}}>{confirmBorrarDia.fecha}</b>. Esta accion no se puede deshacer.</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={function(){setConfirmBorrarDia(null);}} style={{flex:1,padding:"11px",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#6b7280",fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>Cancelar</button>
              <button onClick={function(){
                var cbd=confirmBorrarDia;
                save(registros.filter(function(x){return !(x.area===cbd.area&&x.fecha===cbd.fecha);}));
                setConfirmBorrarDia(null);
                setOpenH(null);
              }} style={{flex:1,padding:"11px",background:"rgba(251,191,36,0.15)",border:"2px solid rgba(251,191,36,0.4)",borderRadius:9,color:"#fbbf24",fontWeight:900,cursor:"pointer",fontFamily:"system-ui"}}>Si, borrar</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal editar registro */}
      {editR&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.92)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,overflowY:"auto"}}>
          <div style={{background:"#080f14",border:"2px solid rgba(56,189,248,0.35)",borderRadius:14,padding:"24px",maxWidth:440,width:"100%"}}>
            <div style={{fontSize:16,fontWeight:900,color:"#38bdf8",marginBottom:4}}>Editar registro</div>
            <div style={{fontSize:12,color:"#4a6a7a",marginBottom:20}}>{editR.area} - {editR.fecha}</div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
              <div>
                <label style={LBL}>Fecha</label>
                <input style={INP} value={editR.fecha||""} onChange={function(e){setEditR(function(p){return Object.assign({},p,{fecha:e.target.value});});}}/>
              </div>
              <div>
                <label style={LBL}>Area</label>
                <select style={INP} value={editR.area||""} onChange={function(e){setEditR(function(p){return Object.assign({},p,{area:e.target.value});});}}>
                  {AREA_NAMES.map(function(a){return <option key={a}>{a}</option>;})}
                </select>
              </div>
            </div>

            <div style={{fontSize:12,fontWeight:800,color:"#38bdf8",marginBottom:8}}>Nomina</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
              {[["Trabajadores","trabajadores"],["Horas extra","horasExtra"],["Cenas","cenas"]].map(function(x){
                return(
                  <div key={x[1]}>
                    <label style={{fontSize:9,color:"#4a6a7a",fontWeight:700}}>{x[0]}</label>
                    <input type="number" style={{width:"100%",background:"rgba(0,0,0,0.4)",border:"2px solid rgba(56,189,248,0.2)",borderRadius:7,padding:"9px",color:"#38bdf8",fontFamily:"Georgia,serif",fontSize:18,fontWeight:700,textAlign:"center",outline:"none"}}
                      value={editR[x[1]]||""} onChange={function(e){var k=x[1];setEditR(function(p){var n=Object.assign({},p);n[k]=e.target.value;return n;});}}/>
                  </div>
                );
              })}
            </div>

            <div style={{fontSize:12,fontWeight:800,color:AREAS[editR.area]?AREAS[editR.area].color:"#38bdf8",marginBottom:8}}>Bultos por presentacion</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:14}}>
              {(PRESENTACIONES[editR.area]||[]).map(function(p){
                var pres=editR.pres||{};
                return(
                  <div key={p.id} style={{background:"rgba(0,0,0,0.3)",borderRadius:7,padding:"8px"}}>
                    <div style={{fontSize:10,color:"#4a6a7a",marginBottom:4}}>{p.label}</div>
                    <input type="number" style={{width:"100%",background:"transparent",border:"none",borderBottom:"2px solid rgba(255,255,255,0.1)",color:"#f0f0e8",fontFamily:"Georgia,serif",fontSize:18,fontWeight:700,textAlign:"center",outline:"none"}}
                      value={pres[p.id]||""} onChange={function(e){setEditR(function(prev){var np=Object.assign({},prev.pres||{});np[p.id]=e.target.value;return Object.assign({},prev,{pres:np});});}}/>
                  </div>
                );
              })}
            </div>

            <div style={{marginBottom:20}}>
              <label style={LBL}>Observaciones</label>
              <input style={INP} value={editR.observaciones||""} onChange={function(e){setEditR(function(p){return Object.assign({},p,{observaciones:e.target.value});});}}/>
            </div>

            <div style={{display:"flex",gap:10}}>
              <button onClick={function(){setEditR(null);}} style={{flex:1,padding:"12px",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#6b7280",fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>Cancelar</button>
              <button onClick={guardarEdicion} style={{flex:2,padding:"12px",background:"linear-gradient(135deg,#0e3a5f,#38bdf8)",border:"none",borderRadius:9,color:"#fff",fontWeight:900,cursor:"pointer",fontFamily:"system-ui"}}>Guardar cambios</button>
            </div>
          </div>
        </div>
      )}
      </div>

      </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
