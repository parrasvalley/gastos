<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPIs | Parras Valley</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* ---------------------------------------------------------------------------
   KPI8 - 14/10/2026.
   [stated] Miguel: "eso de mejor y peor que el dia anterior, eso quitaselo, no
   me gusta. Lo que quiero son graficas de colores bonitas... colores elegantes,
   oscuros, como lo de la bolsa de valores. Negros, fondo negro con contrastes
   verde, rojo y amarillo en las lineas. Son lineas continuas. Y que todo lo que
   vayas a enumerar o KPI quepan en UNA SOLA LINEA HORIZONTAL. No lo quiero en
   dos renglones para una misma linea."
   - Fuera el semaforo y fuera el "que cambio contra el dia anterior".
   - Los KPIs de cada cultivo van en UN SOLO RENGLON que no se parte. Si no
     caben en la pantalla, el renglon se recorre de lado, pero nunca baja a un
     segundo renglon.
   - Graficas de LINEA CONTINUA sobre negro.
--------------------------------------------------------------------------- */
 :root{
   --bg:#05070a; --sup:#080c11;
   --card:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
   --bd:rgba(255,255,255,.09);
   --tx:#e9f0f5; --dim:#56708a; --az:#1f7fc4;
   --rel:0 1px 0 rgba(255,255,255,.09) inset, 0 -1px 0 rgba(0,0,0,.6) inset,
         0 10px 22px -10px #000;
   --relf:0 1px 0 rgba(255,255,255,.08) inset, 0 -2px 0 rgba(0,0,0,.55) inset,
          0 4px 10px -5px rgba(0,0,0,.9);
 }
 *{box-sizing:border-box}
 body{background:var(--bg);color:var(--tx);margin:0;padding:0;
   font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
   -webkit-font-smoothing:antialiased}
 .wrap{max-width:1180px;margin:0 auto;padding:12px 12px 60px}

 .top{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
 .logo{font-size:21px;font-weight:900;letter-spacing:3;color:#dbe7f2}
 .ver{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.6}

 .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;
   padding:12px 13px;margin-bottom:10px;box-shadow:var(--rel)}
 .et{font-size:9px;color:var(--dim);font-weight:900;letter-spacing:1.1}
 .h2{font-size:14px;font-weight:900;letter-spacing:.3}

 input,select{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);
   border-radius:9px;padding:7px 9px;color:#bcd3e8;font-family:inherit;
   font-size:15px;font-weight:800;outline:none;box-shadow:var(--relf)}
 button{font-family:inherit;cursor:pointer;border-radius:9px;font-weight:800;
   font-size:12px;padding:7px 11px;border:1px solid var(--bd);
   background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
   color:var(--dim);box-shadow:var(--relf);transition:transform .07s}
 button:active{transform:translateY(1px)}
 button.p{border-color:rgba(22,163,74,.6);
   background:linear-gradient(180deg,rgba(22,163,74,.34),rgba(22,163,74,.12));color:#5ee08a}

 .chips{display:flex;gap:5px;flex-wrap:wrap}
 .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;
   border-radius:999px;font-size:12px;font-weight:900;cursor:pointer;
   border:1px solid var(--bd);color:var(--dim);
   background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
   box-shadow:var(--relf);white-space:nowrap}
 .chip i{width:9px;height:9px;border-radius:3px;display:inline-block}
 .chip.on{color:#fff;border-color:rgba(255,255,255,.3)}

 /* ---- UN SOLO RENGLON DE KPIs, nunca dos ---- */
 .fila{display:flex;flex-wrap:nowrap;gap:6px;margin-top:9px;
   overflow-x:auto;overflow-y:hidden;padding-bottom:4px;
   scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
 .fila::-webkit-scrollbar{height:6px}
 .fila::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
 .b{flex:1 1 0;min-width:62px;border-radius:9px;padding:6px 7px 7px;
   border:1px solid var(--bd);
   background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.3));
   box-shadow:var(--relf)}
 .b .k{font-size:8px;color:var(--dim);font-weight:900;letter-spacing:.4;
   line-height:1.2;height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .b .v{font-size:14.5px;font-weight:900;margin-top:3px;line-height:1.15;
   font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}

 .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;
   border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.5;color:#fff;
   box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 4px 10px -4px #000}
 .big{font-size:25px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}

 .avisoR{background:linear-gradient(180deg,rgba(220,38,38,.18),rgba(220,38,38,.04));
   border:1px solid rgba(220,38,38,.4);color:#ffb3b3;border-radius:11px;
   padding:9px 12px;margin-bottom:9px;font-weight:700;font-size:13px;box-shadow:var(--relf)}
 .avisoV{background:linear-gradient(180deg,rgba(22,163,74,.18),rgba(22,163,74,.04));
   border:1px solid rgba(22,163,74,.45);color:#7ceb9a;border-radius:11px;
   padding:9px 12px;margin-bottom:9px;font-weight:800;font-size:13px;box-shadow:var(--relf)}

 table{width:100%;border-collapse:collapse}
 th{font-size:8.5px;color:var(--dim);font-weight:900;letter-spacing:.7;padding:6px 4px;
    text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
 th:first-child,td:first-child{text-align:left}
 td{padding:7px 4px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;
    border-bottom:1px solid rgba(255,255,255,.045);white-space:nowrap}
 .tbl{overflow-x:auto}
 .vacio{text-align:center;color:#33465a;padding:34px 10px;font-size:15px;font-weight:800}

 /* ---- barras horizontales ---- */
 .bhr{display:flex;align-items:center;gap:9px;padding:3px 0;
   border-bottom:1px solid rgba(255,255,255,.04)}
 .bhf{width:54px;flex:none;font-size:11px;font-weight:900;color:var(--dim);
   text-align:right;font-variant-numeric:tabular-nums}
 .bhb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
 .bhl{display:flex;align-items:center;gap:7px;width:100%}
 .bhv{font-size:11px;font-weight:900;white-space:nowrap;
   font-variant-numeric:tabular-nums;flex:none}
 .tend{margin-top:9px;display:flex;flex-direction:column;gap:3px}
 .tendr{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
   flex-wrap:wrap;font-variant-numeric:tabular-nums}
 .tendr i{width:11px;height:3px;border-radius:2px;display:inline-block;flex:none}
 .mut2{color:var(--dim);font-weight:700;font-size:11px}
 .tendp{margin-left:2px;padding:2px 8px;border-radius:999px;font-size:11px;
   font-weight:900;background:rgba(255,255,255,.07);color:var(--tx)}

 .lg{display:flex;gap:11px;flex-wrap:wrap;margin-top:6px;font-size:11px;font-weight:800}
 .lg span{display:inline-flex;align-items:center;gap:5px;color:var(--dim)}
 .lg i{width:11px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div id="r"></div>
<script type="text/babel">
var BUILD="v2026-10-14-KPI9";
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var NODO="kpi-dias-v1";               /* el historial propio de KPIs, arranca vacio */
var LINEAS=["Persa","Slicer","Europeo","Morron","Minibel"];
/* COLORES, estilo pantalla de bolsa de valores sobre fondo negro.
   [stated] Miguel, 14/10/2026: "colores elegantes, oscuros, como lo de la bolsa
   de valores. Negros, fondo negro con contrastes verde, rojo y amarillo".
   Son colores de IDENTIDAD de cada cultivo, no semaforo: el verde no quiere
   decir bien ni el rojo mal, nada mas dicen de que cultivo es la linea. Los
   cinco se midieron contra el fondo negro: todos pasan contraste y se
   distinguen entre si tambien para quien ve mal los colores. */
var COLOR={Persa:"#16a34a",Slicer:"#1f7fc4",Europeo:"#bd8c00",
           Morron:"#dc2626",Minibel:"#a96ae8"};
function claro(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  function m(x){return Math.min(255,Math.round(x+(255-x)*0.34))}
  return "rgb("+m(r)+","+m(g)+","+m(b)+")"}
function oscuro(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return "rgb("+Math.round(r*.56)+","+Math.round(g*.56)+","+Math.round(b*.56)+")"}
/* Persa, Morron y Minibel se miden en KILOS; Europeo y Slicer en PIEZAS.
   Control de empaque ya guarda lo llegado y lo empacado en la unidad del cultivo. */
var UNID={Persa:"kg",Slicer:"pz",Europeo:"pz",Morron:"kg",Minibel:"kg"};

var uS=React.useState,uE=React.useEffect,uM=React.useMemo;
function fget(k){return fetch(FB+"/"+k+".json?t="+Date.now())
  .then(function(r){return r.json()}).catch(function(){return null})}
function fput(k,v){return fetch(FB+"/"+k+".json",{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)})
  .then(function(r){return !!(r&&r.ok)}).catch(function(){return false})}
function n0(v){var x=parseFloat(v);return isNaN(x)?0:x}
function r1(n){return Math.round(n*10)/10}
function r2(n){return Math.round(n*100)/100}
function miles(n){return n0(n).toLocaleString("es-MX",{maximumFractionDigits:0})}
function dec(n,d){return n0(n).toLocaleString("es-MX",{minimumFractionDigits:d,maximumFractionDigits:d})}
function pesos(n){return "$"+dec(n,2)}
function dk(f){return String(f||"").replace(/-/g,"")}
function hoy(){var d=new Date();return d.toISOString().slice(0,10)}
function mueveDia(f,n){var d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10)}
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fLargo(f){if(!f)return "";var p=f.split("-");
  return parseInt(p[2],10)+" "+MES[parseInt(p[1],10)-1]+" "+p[0]}


/* ---------- LAS HORAS DE TRABAJO DE LA LINEA, DEL HORARIO REAL ----------
   [stated] Miguel, 14/10/2026: "Lo que importa es cuanto trabajo la LINEA, no
   horas hombre. Si la linea trabajo cinco horas con diez hombres traes 50 horas
   hombre, pero realmente fueron cinco horas de trabajo."
   Se lee el horario de verdad, nomina-dias-v1/{fecha}.lin, y se SUMAN las horas
   que cada cuadrilla le metio a ese cultivo.
   [stated] 14/10: cuando DOS cuadrillas trabajan el mismo cultivo al mismo tiempo,
   las horas SE SUMAN, no se juntan: "eran dos lineas, linea Persa/Slicer trabajando
   para el Slicer y linea Euro trabajando para el Slicer. Si tu sumas eso te va a dar
   10.5". Se intento quitar el traslape y daba 8, y el no lo reconocia como suyo.
   Las horas de cada cuadrilla siempre cuadran con su jornada.
   Comida y Cena no son trabajo y no cuentan. Los paros SI cuentan como tiempo de
   la linea (la linea estaba ocupada en esa fruta) y ademas se reportan aparte,
   porque son justo lo que explica un costo alto. */
function aMin(t){var m=/^(\d{1,2}):(\d{2})$/.exec(String(t||""));
  return m?parseInt(m[1],10)*60+parseInt(m[2],10):null}
function esComida(a){var x=String(a||"").toLowerCase();
  return x.indexOf("comida")>=0||x.indexOf("cena")>=0}
function esParo(a){return String(a||"").toLowerCase().indexOf("paro")>=0}
function suma(iv){var t=0;iv.forEach(function(x){t+=x[1]-x[0]});return t}
function horasDeLinea(dias){
  var out={};                       /* area -> {min, paro} */
  if(!dias||!dias.lin)return null;
  Object.keys(dias.lin).forEach(function(k){
    var rr=dias.lin[k]; if(!rr||!rr.length)return;
    /* la primera area real del dia, para los paros que caen antes de empezar */
    var prim="";
    for(var j=0;j<rr.length;j++){var a0=rr[j].ar;
      if(a0&&!esComida(a0)&&!esParo(a0)){prim=a0;break}}
    var ult="";
    for(var i=0;i<rr.length;i++){
      var r=rr[i]||{}, de=aMin(r.de), a=aMin(r.a), ar=r.ar;
      if(de===null||a===null)continue;
      if(a<=de)a+=1440;                     /* paso de la medianoche */
      if(esComida(ar))continue;             /* no es trabajo */
      var area=ar;
      if(esParo(ar))area=ult||prim;         /* el paro se carga donde venia */
      if(!area)continue;
      if(!out[area])out[area]={iv:[],ivP:[]};
      out[area].iv.push([de,a]);
      if(esParo(ar))out[area].ivP.push([de,a,String(ar)]);
      if(!esParo(ar))ult=ar;
    }
  });
  var res={};
  Object.keys(out).forEach(function(A){
    /* El desglose del paro va MINUTO POR MINUTO: si dos cuadrillas estan paradas
       a la misma hora en el mismo cultivo, ese minuto se cuenta UNA vez y se le
       queda al motivo que llego primero. Asi los motivos siempre suman el total
       de horas paradas, ni mas ni menos. */
    /* El motivo se suma igual que las horas: si dos cuadrillas estan paradas
       a la misma hora en el mismo cultivo, son dos lineas paradas y cuentan las
       dos. Asi los motivos suman exacto las horas paradas de ese cultivo. */
    var mot={};
    out[A].ivP.forEach(function(iv){
      mot[iv[2]]=(mot[iv[2]]||0)+(iv[1]-iv[0]);
    });
    res[A]={min:suma(out[A].iv),paro:suma(out[A].ivP),mot:mot};
  });
  return res;
}

var MOT={"Paro fruta":"falta de fruta","Paro mecanico":"falla mecánica",
          "Paro luz":"falta de luz","Paro otro":"otro"};
function nomMot(k){return MOT[k]||String(k).replace(/^Paro\s*/i,"")}
function listaParo(mot){
  var ks=Object.keys(mot||{}).sort(function(a,b){return mot[b]-mot[a]});
  if(!ks.length)return "";
  return ks.map(function(k){return dec(mot[k]/60,1)+" h "+nomMot(k)}).join(" · ");
}
function calVal(c,u){
  if(!c)return 0;
  if(u==="pz"){
    if(n0(c.pz)>0)return n0(c.pz);          /* Europeo: ya viene en piezas */
    if(n0(c.cj)>0)return n0(c.cj)*36;       /* Slicer: cajas de 36 CT -> piezas */
    return 0;
  }
  return n0(c.kg);
}

/* ---------- arma el dia con lo que ya guardaron las otras apps ---------- */
function armaDia(rend,gast,nom,hlin){
  var filas=[],T={rejas:0,bultos:0,gasto:0,min:0,mx:0,np:0};
  LINEAS.forEach(function(L){
    var R=rend[L]||null, G=(gast&&gast[L])||null, N=nom[L]||null;
    var rejas=0,rec=0,emp=0,ca=0,cb=0,cc=0;
    if(R){Object.keys(R).forEach(function(k){
      var r=R[k]||{};
      rejas+=n0(r.rejas); rec+=n0(r.kgRec); emp+=n0(r.kgEmp);
      var d=r.det||{};
      /* OJO CON LAS UNIDADES DEL DETALLE POR CALIDAD.
         Persa, Morron y Minibel: lo llegado y el detalle van los dos en KILOS.
         Europeo: los dos en PIEZAS (el detalle trae pz).
         Slicer: lo llegado va en PIEZAS pero el detalle trae los KILOS y las
         CAJAS de 36 CT. Sumar esos kilos contra piezas da porcentajes absurdos,
         asi que ahi se usan las cajas por 36, que es justo lo empacado. */
      ca+=calVal(d.a,UNID[L]); cb+=calVal(d.b,UNID[L]); cc+=calVal(d.c,UNID[L]);
    })}
    var min=N?n0(N.min):0, mx=N?n0(N.mx):0, np=N?n0(N.np):0;
    /* DOS HORAS DISTINTAS, Y NO SE CRUZAN (Miguel, 14/10/2026).
       HORAS HOMBRE = la suma de lo que trabajaron todas las personas en esa
       linea. Sirve para el COSTO, porque eso es lo que se paga.
       HORAS DE LINEA = las horas de RELOJ que la linea estuvo en ese cultivo,
       o sea horas hombre entre la gente. Si 24 personas metieron 132 horas
       hombre, la linea corrio 5.5 horas. ESA es con la que se mide el ritmo:
       los bultos y las rejas por hora van sobre las horas de linea, no sobre
       las horas hombre. Con horas hombre salian 26 bultos/hora y no cuadraba
       con lo que el ve en el empaque. */
    var hh=min/60, hx=mx/60;
    var HL=hlin&&hlin[L]?hlin[L]:null;
    var h=HL?HL.min/60:(np>0?(min/np)/60:0);   /* del horario real; si no hay, promedio */
    var hpar=HL?HL.paro/60:0;
    var mot=HL?(HL.mot||{}):{};
    /* [stated] 14/10: el ritmo se saca con las horas EFECTIVAS, las que de verdad
       se estuvo trabajando. "Me vas a poner que fueron diez pero seis paradas y
       cuatro trabajando, y me divides entre cuatro lo que realmente trabajo".
       Las horas totales y las paradas se siguen reportando, porque son las que se
       pagan y las que explican el costo. */
    var hef=h-hpar; if(hef<0)hef=0;
    var exacta=!!HL;
    var bultos=G?n0(G.bultos):0, gasto=G?n0(G.totalCosto):0;
    var merma=rec-emp;
    if(!R&&!G&&!N)return;                      /* esa linea no corrio ese dia */
    filas.push({L:L,u:UNID[L],rejas:rejas,rec:rec,emp:emp,
      pa:rec>0?100*ca/rec:0, pb:rec>0?100*cb/rec:0, pc:rec>0?100*cc/rec:0,
      pm:rec>0?100*merma/rec:0, merma:merma,
      h:h,hef:hef,hh:hh,hx:hx,hpar:hpar,mot:mot,exacta:exacta,np:np,bultos:bultos,gasto:gasto,
      rejasH:hef>0?rejas/hef:0, bultosH:hef>0?bultos/hef:0, cpb:bultos>0?gasto/bultos:0,
      falta:{rend:!R,gast:!G,nom:!N}});
    T.rejas+=rejas; T.bultos+=bultos; T.gasto+=gasto; T.min+=min; T.mx+=mx; T.np+=np;
  });
  /* En el TOTAL del dia no se suman las horas de linea: las lineas corren al
     mismo tiempo y sumarlas no significa nada. El total va en horas hombre. */
  T.hh=T.min/60; T.hx=T.mx/60;
  T.hpar=0; T.hef=0; T.mot={};
  filas.forEach(function(x){T.hpar+=x.hpar; T.hef+=x.hef;
    Object.keys(x.mot||{}).forEach(function(k){T.mot[k]=(T.mot[k]||0)+x.mot[k]})});
  T.cpb=T.bultos>0?T.gasto/T.bultos:0;
  return {filas:filas,tot:T};
}

/* ---------- comparacion contra el dia guardado anterior ---------- */
function cmp(hoyV,antV,menosEsMejor){
  if(ant0(antV)===0||hoyV===undefined||hoyV===null)return null;
  var d=hoyV-antV, p=100*d/Math.abs(antV);
  if(Math.abs(p)<0.5)return null;     /* si no se movio, no se escribe nada */
  var bueno=menosEsMejor?(d<0):(d>0);
  return {t:(d>0?"▲ ":"▼ ")+dec(Math.abs(p),1)+"%", c:bueno?"up":"dn", p:p};
}
function ant0(v){return (v===undefined||v===null||isNaN(v))?0:v}

function Cmp(props){
  var c=props.c;
  if(!c)return null;
  return <div className={"cmp "+c.c}>{c.t}</div>;
}

function fLbl(f){if(!f)return "";var p=String(f).split("-");
  return parseInt(p[2],10)+" "+MES[parseInt(p[1],10)-1]}

/* un recuadro. Sin semaforo: [stated] Miguel, 14/10/2026: "eso de mejor y peor
   que el dia anterior, eso quitaselo, no me gusta". La tendencia se ve en la
   grafica de lineas, no pintando cada numero. */
function B(props){
  return (<div className="b">
    <div className="k">{props.k}</div>
    <div className="v" style={{color:props.col||"var(--tx)"}}>{props.v}</div>
  </div>);
}

/* =====================  GRAFICA DE LINEAS CONTINUAS  =====================
   [stated] Miguel, 14/10/2026: "graficas de colores bonitas... colores elegantes,
   oscuros, como lo de la bolsa de valores. Negros, fondo negro con contrastes
   verde, rojo y amarillo en las lineas. Son lineas continuas."
   Una sola medida y un solo eje. Cada linea es un cultivo, con su nombre escrito
   al final de la linea, asi que el color nunca es lo unico que la identifica.
   Al pasar el dedo o el raton sale la cruz y los numeros de esa fecha. */
var VB_W=1000;
function Lineas(props){
  var series=props.series||[];     /* [{nom, col, datos:[{f,lbl,v}]}] */
  var fmt=props.fmt||function(v){return dec(v,1)};
  var H=props.alto||270;
  var marca=props.marca||"";       /* fecha que se esta viendo, se senala */
  var sT=uS(-1),hov=sT[0],setHov=sT[1];
  var vivas=series.filter(function(s){return s.datos&&s.datos.length});
  if(!vivas.length)return <div className="vacio">Todavía no hay días guardados.</div>;
  var n=vivas[0].datos.length;
  var L=54,R=VB_W-14,T=16,Bq=H-26;
  var todos=[];vivas.forEach(function(s){s.datos.forEach(function(d){todos.push(n0(d.v))})});
  var mx=Math.max.apply(null,todos), mn=Math.min.apply(null,todos);
  if(mn>0)mn=0;                                  /* el cero siempre a la vista */
  if(mx===mn)mx=mn+1;
  var pad=(mx-mn)*0.08; mx+=pad;
  function X(i){return n<2?(L+R)/2:L+(R-L)*i/(n-1)}
  function Y(v){return Bq-(n0(v)-mn)/(mx-mn)*(Bq-T)}
  var reng=[0,1,2,3,4].map(function(i){return mn+(mx-mn)*i/4});
  function dPath(s){
    return s.datos.map(function(d,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(d.v).toFixed(1)}).join(" ");
  }
  function dArea(s){
    return dPath(s)+" L"+X(s.datos.length-1).toFixed(1)+" "+Bq+" L"+X(0).toFixed(1)+" "+Bq+" Z";
  }
  var etq=[]; var paso=Math.max(1,Math.ceil(n/7));
  for(var i=0;i<n;i++)if(i%paso===0||i===n-1)etq.push(i);
  var iMarca=-1;
  if(marca)vivas[0].datos.forEach(function(d,i){if(d.f===marca)iMarca=i});

  return (
  <div>
    <svg viewBox={"0 0 "+VB_W+" "+H} style={{width:"100%",display:"block"}}
      onMouseLeave={function(){setHov(-1)}}
      onMouseMove={function(e){
        var r=e.currentTarget.getBoundingClientRect();
        var x=(e.clientX-r.left)/r.width*VB_W;
        var i=Math.round((x-L)/((R-L)||1)*(n-1));
        setHov(i<0?0:(i>n-1?n-1:i));}}
      onTouchMove={function(e){
        var t=e.touches[0]; if(!t)return;
        var r=e.currentTarget.getBoundingClientRect();
        var x=(t.clientX-r.left)/r.width*VB_W;
        var i=Math.round((x-L)/((R-L)||1)*(n-1));
        setHov(i<0?0:(i>n-1?n-1:i));}}>
      <defs>
        {vivas.map(function(s,k){return (
          <linearGradient key={k} id={"g"+k} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={s.col} stopOpacity={vivas.length===1?.30:.13}/>
            <stop offset="100%" stopColor={s.col} stopOpacity="0"/>
          </linearGradient>)})}
      </defs>
      {reng.map(function(v,i){return (
        <g key={i}>
          <line x1={L} y1={Y(v)} x2={R} y2={Y(v)} stroke="rgba(255,255,255,.055)" strokeWidth="1"/>
          <text x={L-7} y={Y(v)+4} textAnchor="end" fontSize="12.5" fill="#56708a"
            fontWeight="700">{fmt(v)}</text>
        </g>)})}
      {iMarca>=0&&<line x1={X(iMarca)} y1={T-4} x2={X(iMarca)} y2={Bq}
        stroke="rgba(255,255,255,.16)" strokeWidth="1" strokeDasharray="3 4"/>}
      {/* el relleno solo cuando hay UNA linea: con varias se enturbia todo */}
      {vivas.length===1&&vivas.map(function(s,k){return (
        <path key={"a"+k} d={dArea(s)} fill={"url(#g"+k+")"}/>)})}
      {vivas.map(function(s,k){return (
        <path key={"l"+k} d={dPath(s)} fill="none" stroke={s.col} strokeWidth="2.4"
          strokeLinejoin="round" strokeLinecap="round"
          style={{filter:"drop-shadow(0 0 5px "+s.col+"66)"}}/>)})}
      {vivas.map(function(s,k){var d=s.datos[s.datos.length-1];
        return <circle key={"p"+k} cx={X(s.datos.length-1)} cy={Y(d.v)} r="4"
          fill="#05070a" stroke={s.col} strokeWidth="2.4"/>})}
      {etq.map(function(i){return (
        <text key={i} x={X(i)} y={H-7} textAnchor={i===0?"start":(i===n-1?"end":"middle")}
          fontSize="12.5" fill="#56708a" fontWeight="700">{vivas[0].datos[i].lbl}</text>)})}
      {hov>=0&&hov<n&&(
      <g>
        <line x1={X(hov)} y1={T-4} x2={X(hov)} y2={Bq} stroke="rgba(255,255,255,.3)" strokeWidth="1"/>
        {vivas.map(function(s,k){return <circle key={k} cx={X(hov)} cy={Y(s.datos[hov].v)} r="4.5"
          fill="#05070a" stroke={s.col} strokeWidth="2.6"/>})}
        {(function(){
          var w=Math.max(132,58+fmt(vivas[0].datos[hov].v).length*8.5), alto=24+vivas.length*20;
          var x=X(hov)+12; if(x+w>R)x=X(hov)-w-12;
          return (
          <g>
            <rect x={x} y={T} width={w} height={alto} rx="9" fill="rgba(3,6,9,.96)"
              stroke="rgba(255,255,255,.14)"/>
            <text x={x+11} y={T+17} fontSize="13" fill="#9fb4c8" fontWeight="800">
              {vivas[0].datos[hov].lbl}</text>
            {vivas.map(function(s,k){return (
              <g key={k}>
                <rect x={x+11} y={T+27+k*20} width="9" height="9" rx="2" fill={s.col}/>
                <text x={x+26} y={T+36+k*20} fontSize="13" fill="#9fb4c8" fontWeight="700">{s.nom}</text>
                <text x={x+w-11} y={T+36+k*20} fontSize="13" fill="#e9f0f5" fontWeight="900"
                  textAnchor="end">{fmt(s.datos[hov].v)}</text>
              </g>)})}
          </g>)})()}
      </g>)}
    </svg>
    {vivas.length>1&&
      <div className="lg">{vivas.map(function(s){return (
        <span key={s.nom}><i style={{background:s.col}}/>{s.nom}</span>)})}</div>}
  </div>);
}

/* las medidas que se pueden graficar */
var MEDIDAS=[
  {k:"cpb",   n:"$ / BULTO",      fmt:function(v){return "$"+dec(v,2)}},
  {k:"bultos",n:"BULTOS",         fmt:function(v){return miles(v)}},
  {k:"bultosH",n:"BULTOS / HORA", fmt:function(v){return dec(v,0)}},
  {k:"rejas", n:"REJAS",          fmt:function(v){return miles(v)}},
  {k:"rejasH",n:"REJAS / HORA",   fmt:function(v){return dec(v,0)}},
  {k:"pa",    n:"% PRIMERA",      fmt:function(v){return dec(v,1)+"%"}},
  {k:"pm",    n:"% MERMA",        fmt:function(v){return dec(v,1)+"%"}},
  {k:"hpar",  n:"HORAS PARADAS",  fmt:function(v){return dec(v,1)+" h"}},
  {k:"gasto", n:"GASTO",          fmt:function(v){return "$"+miles(v)}}
];
function medDe(k){for(var i=0;i<MEDIDAS.length;i++)if(MEDIDAS[i].k===k)return MEDIDAS[i];
  return MEDIDAS[0]}

/* =====================  BARRAS HORIZONTALES  =====================
   [stated] Miguel, 14/10/2026: "la evolucion del mismo concepto en diferentes
   dias para ver el comportamiento... con una grafica de barra horizontal".
   Un renglon por fecha, la barra crece a la derecha y el numero va al final.
   Cuando estan todos los cultivos, cada fecha trae una barrita por cultivo. */
function BarrasH(props){
  var series=(props.series||[]).filter(function(s){return s.datos&&s.datos.length});
  var fmt=props.fmt||function(v){return dec(v,1)};
  if(!series.length)return null;
  var n=series[0].datos.length;
  var mx=0; series.forEach(function(s){s.datos.forEach(function(d){
    if(n0(d.v)>mx)mx=n0(d.v)})});
  if(mx<=0)mx=1;
  var alt=series.length>1?9:17;
  var ix=[]; for(var i=n-1;i>=0;i--)ix.push(i);     /* la fecha mas nueva arriba */
  return (
  <div style={{marginTop:9}}>
    {series.length>1&&
      <div className="lg" style={{marginBottom:7}}>{series.map(function(s){return (
        <span key={s.nom}><i style={{background:s.col}}/>{s.nom}</span>)})}</div>}
    {ix.map(function(i){
      return (
      <div key={i} className="bhr">
        <div className="bhf">{series[0].datos[i].lbl}</div>
        <div className="bhb">
          {series.map(function(s,k){
            var v=n0(s.datos[i].v), w=Math.max(v>0?1.5:0,v/mx*100);
            return (
            <div key={k} className="bhl" style={{height:alt}}>
              <div style={{width:w+"%",height:"100%",borderRadius:"3px",
                background:"linear-gradient(90deg,"+s.col+"cc,"+s.col+")",
                boxShadow:"0 0 7px "+s.col+"55"}}/>
              <span className="bhv" style={{color:series.length>1?s.col:"var(--tx)"}}>
                {fmt(v)}</span>
            </div>)})}
        </div>
      </div>)})}
  </div>);
}

/* de donde salio y a donde llego: sube o baja. Es un dato, no una calificacion */
function Tendencia(props){
  var series=(props.series||[]).filter(function(s){return s.datos&&s.datos.length>1});
  var fmt=props.fmt||function(v){return dec(v,1)};
  if(!series.length)return null;
  return (
  <div className="tend">
    {series.map(function(s){
      var a=n0(s.datos[0].v), b=n0(s.datos[s.datos.length-1].v);
      var p=a!==0?100*(b-a)/Math.abs(a):null;
      var fl=p===null?"":(Math.abs(p)<1?"=":(p>0?"▲":"▼"));
      return (
      <div key={s.nom} className="tendr">
        <i style={{background:s.col}}/>
        <b style={{color:s.col}}>{s.nom}</b>
        <span className="mut2">{s.datos[0].lbl}</span>
        <span>{fmt(a)}</span>
        <span className="mut2">&rarr;</span>
        <span className="mut2">{s.datos[s.datos.length-1].lbl}</span>
        <b>{fmt(b)}</b>
        {p!==null&&<span className="tendp">{fl} {dec(Math.abs(p),0)}%</span>}
      </div>)})}
  </div>);
}

function App(){
  var s1=uS(hoy()),f=s1[0],setF=s1[1];
  var sC=uS(""),cul=sC[0],setCul=sC[1];          /* "" = todos los cultivos */
  var sM=uS("dia"),modo=sM[0],setModo=sM[1];     /* "dia" | "todas" las fechas */
  var sD=uS("cpb"),med=sD[0],setMed=sD[1];       /* que medida se grafica */
  var sG=uS("linea"),tipo=sG[0],setTipo=sG[1];   /* "linea" | "barras" */
  var s3=uS(null),rend=s3[0],setRend=s3[1];
  var s4=uS(null),gast=s4[0],setGast=s4[1];
  var s5=uS(null),nom=s5[0],setNom=s5[1];
  var sH=uS(null),hlin=sH[0],setHlin=sH[1];
  var s6=uS({}),hist=s6[0],setHist=s6[1];
  var s7=uS(false),cargando=s7[0],setCargando=s7[1];
  var s8=uS(""),msg=s8[0],setMsg=s8[1];
  var sB=uS(""),avBul=sB[0],setAvBul=sB[1];

  uE(function(){ fget(NODO).then(function(d){ setHist((d&&typeof d==="object")?d:{}) }); },[]);

  /* EL BOTON VERDE DEL ARCHIVO DE BULTOS SIGUE ENTRANDO POR AQUI.
     El link del archivo de trazabilidad apunta a kpis.html?x=<epoch>#bultos=<b64>
     y escribe kpi-bultos-v1/{fecha}, que es de donde GASTOS saca las cajas.
     Esta pagina ya no usa ese nodo para calcular, pero el lector NO se puede
     quitar: si se va, se rompe la cadena y gastos se queda sin bultos. */
  uE(function(){
    var h=String(location.hash||"")+"&"+String(location.search||"");
    var m=h.match(/bultos=([A-Za-z0-9_\-+\/=]+)/);
    if(!m)return;
    try{
      var s=m[1].split("-").join("+").split("_").join("/");
      while(s.length%4)s+="=";
      var pl=JSON.parse(decodeURIComponent(escape(atob(s))));
      if(!pl||!pl.f||!pl.b)throw new Error("payload incompleto");
      setAvBul("Cargando los bultos del "+fLargo(pl.f)+"...");
      fput("kpi-bultos-v1/"+pl.f,pl.b).then(function(ok){
        if(!ok){setAvBul("✗ NO se pudieron cargar los bultos. Vuelve a picarle al botón.");return}
        var n=0;Object.keys(pl.b).forEach(function(k){
          var o=pl.b[k]||{};Object.keys(o).forEach(function(p){n+=n0(o[p])})});
        setAvBul("✓ Bultos cargados del "+fLargo(pl.f)+": "+miles(n)+" cajas");
        setF(pl.f); setModo("dia");
        try{history.replaceState(null,"",location.pathname)}catch(e){}
      });
    }catch(err){ setAvBul("✗ El link de bultos vino incompleto."); }
  },[]);

  uE(function(){
    if(!f)return;
    setCargando(true);setMsg("");
    var pr=LINEAS.map(function(L){
      return fget("rendimientos-hist-v1/"+dk(f)+"/"+L+"/ranchos")
        .then(function(v){return {L:L,v:v}})});
    var pn=LINEAS.map(function(L){
      return fget("nomina-hist-v1/"+L+"/"+f).then(function(v){return {L:L,v:v}})});
    Promise.all([Promise.all(pr),fget("gastos-dias-v1/"+f),Promise.all(pn),
                 fget("nomina-dias-v1/"+f)])
      .then(function(res){
        var R={},N={};
        res[0].forEach(function(x){if(x.v&&typeof x.v==="object")R[x.L]=x.v});
        res[2].forEach(function(x){if(x.v&&typeof x.v==="object")N[x.L]=x.v});
        setRend(R);setGast(res[1]||null);setNom(N);
        setHlin(horasDeLinea(res[3]));setCargando(false);
      }).catch(function(){setCargando(false);setMsg("No se pudo leer.")});
  },[f]);

  var dia=uM(function(){
    if(!rend&&!gast&&!nom)return null;
    return armaDia(rend||{},gast,nom||{},hlin);
  },[rend,gast,nom,hlin]);

  function guarda(){
    if(!dia||!dia.filas.length){setMsg("Ese día no trae nada que guardar.");return}
    var e={f:f,ts:Date.now(),filas:dia.filas,tot:dia.tot};
    setMsg("Guardando...");
    fput(NODO+"/"+f,e).then(function(ok){
      if(!ok){setMsg("✗ NO se guardó. Vuelve a intentar.");return}
      setHist(function(p){var n=Object.assign({},p);n[f]=e;return n});
      setMsg("✓ Guardado el "+fLargo(f)+" · ya aparece en TODAS LAS FECHAS");
    });
  }

  var faltan=uM(function(){
    if(!dia)return [];

    var ver=dia.filas.filter(function(x){return !cul||x.L===cul});
    var sr=ver.filter(function(x){return x.falta.rend}).map(function(x){return x.L});
    var sg=ver.filter(function(x){return x.falta.gast}).map(function(x){return x.L});
    var sn=ver.filter(function(x){return x.falta.nom}).map(function(x){return x.L});
    if(sr.length)out.push("Faltan las REJAS: este día no está guardado en CONTROL DE EMPAQUE ("+sr.join(", ")+"). Entra a esa app, abre el día y dale Guardar; sin eso no hay rejas, ni calidades, ni merma.");
    if(sg.length)out.push("Falta guardar el día en GASTOS: "+sg.join(", ")+". Sin eso no hay bultos ni costo.");
    if(sn.length)out.push("Falta guardar el día en NÓMINA: "+sn.join(", ")+". Sin eso no hay horas.");

  var fechas=uM(function(){
    return Object.keys(hist).filter(function(k){

      if(!cul)return true;
      return (d.filas||[]).some(function(x){return x.L===cul});

  },[hist,cul]);

  function valDe(d,L,k){
    if(!d)return 0;
    if(!L){
      var T=d.tot||{};
      if(k==="pa"||k==="pm"){            /* los % no se suman: se pesan por lo que llego */
        var num=0,den=0;
        (d.filas||[]).forEach(function(x){num+=n0(x[k])*n0(x.rec);den+=n0(x.rec)});
        return den>0?num/den:0;
      }
      if(k==="bultosH"||k==="rejasH"){
        var a=0,b=0;
        (d.filas||[]).forEach(function(x){
          a+=k==="bultosH"?n0(x.bultos):n0(x.rejas); b+=n0(x.hef)});
        return b>0?a/b:0;
      }
      return n0(T[k]);
    }
    var fl=(d.filas||[]).filter(function(x){return x.L===L})[0];
    return fl?n0(fl[k]):0;
  }

  var nTot=Object.keys(hist).length;
  var M=medDe(med);
  var series=uM(function(){
    if(!fechas.length)return [];

    /* todos: una linea por cultivo que haya corrido alguna vez */
    return LINEAS.filter(function(L){
      return fechas.some(function(k){
        return (hist[k].filas||[]).some(function(x){return x.L===L})})
    }).map(function(L){
      return {nom:L,col:COLOR[L],datos:fechas.map(function(k){
        return {f:k,lbl:fLbl(k),v:valDe(hist[k],L,med)}})}});
  },[fechas,hist,med,cul]);

  var filasVer=uM(function(){

    return dia.filas.filter(function(x){return !cul||x.L===cul});
  },[dia,cul]);

  function Medidas(){
    return (<div className="chips" style={{marginTop:7}}>

        {LINEAS.map(function(L){return (
          <div key={L} className={"chip"+(cul===L?" on":"")} onClick={function(){setCul(L)}}

        <div className={"chip"+(modo==="todas"?" on":"")} onClick={function(){setModo("todas")}}

      {modo==="dia"&&<div style={{fontSize:10.5,color:"var(--dim)",fontWeight:700,marginTop:7}}>
        Guardar el día deja esta fecha en el historial de KPIs. De ahí salen la
        gráfica y la tabla de TODAS LAS FECHAS, y la puedes volver a abrir cuando
        quieras. {hist[f]?"Este día ya está guardado.":"Este día todavía no está guardado."}
      </div>}
    </div>

    {avBul&&<div className={avBul.indexOf("✗")>=0?"avisoR":"avisoV"}>{avBul}</div>}

    {/* ====================  UN DÍA  ==================== */}
    {modo==="dia"&&(
    <div>
      {cargando&&<div className="vacio">Leyendo las apps...</div>}
      {!cargando&&faltan.map(function(t,i){return <div className="avisoR" key={i}>{t}</div>})}

      {!cargando&&filasVer.length>0&&(
      <div>
        <div className="card">
          <div className="h2">{fLargo(f)} · {cul?cul:"todos los cultivos"}</div>
          <div className="fila">
            <B k="REJAS" v={miles(cul?filasVer[0].rejas:dia.tot.rejas)}/>
            <B k="BULTOS" v={miles(cul?filasVer[0].bultos:dia.tot.bultos)}/>
            <B k="H HOMBRE" v={dec(cul?filasVer[0].hh:dia.tot.hh,1)}/>
            <B k="GASTO" v={"$"+miles(cul?filasVer[0].gasto:dia.tot.gasto)}/>
            <B k="$ / BULTO" v={pesos(cul?filasVer[0].cpb:dia.tot.cpb)} col="#5ee08a"/>
            <B k="GENTE" v={miles(cul?filasVer[0].np:dia.tot.np)}/>
            <B k="PARO" v={dec(cul?filasVer[0].hpar:dia.tot.hpar,1)}
               col={(cul?filasVer[0].hpar:dia.tot.hpar)>0?"#ef6a6a":null}/>
          </div>
        </div>

        {filasVer.map(function(x){
          return (
          <div className="card" key={x.L}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              flexWrap:"wrap",gap:9}}>
              <span className="pill" style={{background:COLOR[x.L]}}>{x.L.toUpperCase()}</span>
              <div style={{textAlign:"right"}}>
                <div className="et">COSTO POR BULTO</div>
                <div className="big" style={{color:COLOR[x.L]}}>{pesos(x.cpb)}</div>
              </div>
            </div>
            {/* UN SOLO RENGLON. Si no caben, se recorre de lado, nunca baja. */}
            <div className="fila">
              <B k="REJAS" v={miles(x.rejas)}/>
              <B k="BULTOS" v={miles(x.bultos)}/>
              <B k={"H LÍNEA"+(x.exacta?"":" ~")} v={dec(x.h,1)}/>
              <B k="H EFECTIVAS" v={dec(x.hef,1)}/>
              <B k="REJAS/H" v={dec(x.rejasH,0)}/>
              <B k="BULTOS/H" v={dec(x.bultosH,0)}/>
              <B k="GASTO" v={"$"+miles(x.gasto)}/>
              <B k="1a" v={dec(x.pa,1)+"%"}/>
              <B k="2a" v={dec(x.pb,1)+"%"}/>
              <B k="3a" v={dec(x.pc,1)+"%"}/>
              <B k="MERMA" v={dec(x.pm,1)+"%"}/>
              <B k="PARO" v={dec(x.hpar,1)} col={x.hpar>0?"#ef6a6a":null}/>
            </div>
            <div style={{fontSize:10.5,color:"var(--dim)",marginTop:8,fontWeight:700}}>
              {miles(x.np)} personas · {dec(x.hh,1)} horas hombre · {dec(x.hx,1)} h extra
              {x.rejas===0&&<span style={{color:"#ef6a6a"}}> · sin rejas: falta guardar este día en control de empaque</span>}
              {x.hpar>0&&<div style={{color:"#ef6a6a",marginTop:4,fontSize:11.5,fontWeight:800}}>
                de las {dec(x.h,1)} h, {dec(x.hef,1)} trabajando y {dec(x.hpar,1)} paradas: {listaParo(x.mot)}
                <span style={{color:"var(--dim)"}}> · el ritmo va sobre las efectivas</span></div>}
              <span style={{marginLeft:5}}>&middot; los % van sobre lo que llegó</span>
            </div>
          </div>);
        })}

        {!cul&&dia.tot.hpar>0&&(
        <div className="card">
          <div className="et" style={{marginBottom:7}}>HORAS PARADAS DEL DÍA</div>
          <div style={{display:"flex",alignItems:"baseline",gap:9,flexWrap:"wrap"}}>
            <div className="big" style={{color:"#dc2626"}}>{dec(dia.tot.hpar,1)} h</div>
            <div style={{fontSize:12,color:"var(--dim)",fontWeight:800}}>{listaParo(dia.tot.mot)}</div>
          </div>
          <div className="tbl"><table style={{marginTop:9}}>
            <thead><tr><th>LÍNEA</th><th>HORAS</th><th>EFECTIVAS</th><th>PARADA</th><th>POR QUÉ</th></tr></thead>
            <tbody>
              {dia.filas.filter(function(x){return x.hpar>0}).map(function(x){return (
                <tr key={x.L}>
                  <td><span className="pill" style={{fontSize:10,padding:"2px 8px",
                    background:COLOR[x.L]}}>{x.L}</span></td>
                  <td>{dec(x.h,1)}</td>
                  <td>{dec(x.hef,1)}</td>
                  <td style={{color:"#ef6a6a",fontWeight:900}}>{dec(x.hpar,1)}</td>
                  <td style={{fontSize:11,color:"var(--dim)"}}>{listaParo(x.mot)}</td>
                </tr>)})}
            </tbody>
          </table></div>
        </div>)}
      </div>)}

      {!cargando&&dia&&filasVer.length===0&&
        <div className="vacio">{cul?("No hay "+cul+" este día."):"No hay nada de este día todavía."}</div>}

      {fechas.length>0
        ? <Grafica alto={240} marca={f}/>
        : <div className="card"><div className="h2">Sin historial todavía</div>
            <div style={{fontSize:13,color:"var(--dim)",fontWeight:700,marginTop:7,lineHeight:1.55}}>
              Aquí va la gráfica de cómo se viene comportando cada medición día con día.
              Arranca en cuanto le des <b>Guardar el día</b> a dos fechas.</div></div>}
    </div>)}

    {/* ====================  TODAS LAS FECHAS  ==================== */}
    {modo==="todas"&&(
    <div>
      {fechas.length===0
        ? <div className="card">
            <div className="h2">No hay nada guardado todavía</div>
            <div style={{fontSize:13,color:"var(--dim)",fontWeight:700,marginTop:8,lineHeight:1.6}}>
              {nTot===0
                ? "El historial de KPIs está en ceros: no se ha guardado ningún día. No es que falte el "+(cul||"cultivo")+", es que no hay ni una sola fecha."
                : ("Hay "+nTot+" "+(nTot===1?"día guardado":"días guardados")+", pero en "+(cul||"ese filtro")+" no aparece ninguno.")}
              <div style={{marginTop:8,color:"var(--tx)"}}>
                Para que un día entre aquí: ponle la fecha en UN DÍA, revisa que traiga
                números, y dale <b>Guardar el día</b>. Cada vez que guardes uno, esta
                gráfica crece.</div>
              {nTot>0&&<div style={{marginTop:8}}>Guardados: {Object.keys(hist).sort().map(fLbl).join(" · ")}</div>}
            </div>
            <div style={{marginTop:11}}>
              <button className="p" onClick={function(){setModo("dia")}}>Ir a un día</button>
            </div>
          </div>
        : (<div>
          <Grafica alto={300}/>
          <div className="card">
            <div className="et" style={{marginBottom:6}}>LOS DÍAS GUARDADOS</div>
            <div className="tbl"><table>
              <thead><tr>
                <th>DÍA</th><th>REJAS</th><th>BULTOS</th><th>B/H</th><th>R/H</th>
                <th>GASTO</th><th>$/BULTO</th><th>MERMA</th><th>1a</th><th>PARO</th><th></th>
              </tr></thead>
              <tbody>
                {fechas.slice().reverse().map(function(k){
                  return (<tr key={k}>
                    <td style={{fontWeight:900}}>{fLbl(k)}</td>
                    <td>{miles(valDe(hist[k],cul,"rejas"))}</td>
                    <td>{miles(valDe(hist[k],cul,"bultos"))}</td>
                    <td>{dec(valDe(hist[k],cul,"bultosH"),0)}</td>
                    <td>{dec(valDe(hist[k],cul,"rejasH"),0)}</td>
                    <td>{"$"+miles(valDe(hist[k],cul,"gasto"))}</td>
                    <td style={{fontWeight:900,color:cul?COLOR[cul]:"#5ee08a"}}>
                      {pesos(valDe(hist[k],cul,"cpb"))}</td>
                    <td>{dec(valDe(hist[k],cul,"pm"),1)}%</td>
                    <td>{dec(valDe(hist[k],cul,"pa"),1)}%</td>
                    <td style={{color:valDe(hist[k],cul,"hpar")>0?"#ef6a6a":"var(--dim)"}}>
                      {dec(valDe(hist[k],cul,"hpar"),1)}</td>
                    <td><button onClick={function(){setF(k);setModo("dia")}}>abrir</button></td>
                  </tr>)})}
              </tbody>
            </table></div>
          </div>
        </div>)}
    </div>)}
  </div>);
}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);
</script>
</body>
</html>
